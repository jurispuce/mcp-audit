name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, type check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test

  e2e:
    name: End-to-end tests against the container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mcp-audit:ci
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the scripted stand-in for an AI gateway (in-app AI tests)
        run: |
          (PORT=4999 node e2e/fake-llm.mjs > fake-llm.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4999/v1/models > /dev/null && break; sleep 1; done

      - name: Start the scripted mail server (email tests)
        run: |
          (SMTP_PORT=2525 HTTP_PORT=2526 node e2e/fake-smtp.mjs > fake-smtp.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:2526/messages > /dev/null && break; sleep 1; done

      - name: Start containers (fresh volumes, read-only root filesystem)
        run: |
          docker run -d --name app   -p 3000:3000 -e TEST_SEED_ENABLED=true -e SMTP_HOST=host.docker.internal -e SMTP_PORT=2525 -e "SMTP_FROM=mcp-audit tests <audit@example.test>" --add-host=host.docker.internal:host-gateway --read-only --tmpfs /tmp mcp-audit:ci
          docker run -d --name first -p 3001:3000 -e TEST_SEED_ENABLED=true --read-only --tmpfs /tmp mcp-audit:ci
          # an instance without passwords: people join by invitation with a passkey (#89, #90)
          docker run -d --name passkey -p 3003:3000 -e TEST_SEED_ENABLED=true -e SIGN_IN_METHOD=passkey -e ORIGIN=http://localhost:3003 -e INITIAL_ADMIN_EMAIL=first@example.test -e "INITIAL_ADMIN_NAME=Fia First" -e SMTP_HOST=host.docker.internal -e SMTP_PORT=2525 -e "SMTP_FROM=mcp-audit tests <audit@example.test>" --add-host=host.docker.internal:host-gateway --read-only --tmpfs /tmp mcp-audit:ci
          # an instance that sets itself up from a tenant profile at its first start (#91)
          node e2e/tenant-profile.mjs http://host.docker.internal:4999 > tenant-profile.json
          docker run -d --name profile -p 3004:3000 -e TEST_SEED_ENABLED=true -e ORIGIN=http://localhost:3004 -e TENANT_PROFILE=/config/tenant-profile.json -v "$PWD/tenant-profile.json:/config/tenant-profile.json:ro" -e SMTP_HOST=host.docker.internal -e SMTP_PORT=2525 -e "SMTP_FROM=mcp-audit tests <audit@example.test>" --add-host=host.docker.internal:host-gateway --read-only --tmpfs /tmp mcp-audit:ci
          # 'prod' uses .env.example as shipped, including its empty settings such as ORIGIN=
          docker run -d --name prod  -p 3002:3000 --env-file .env.example -e BACKUP_PASSPHRASE= --read-only --tmpfs /tmp mcp-audit:ci
          for port in 3000 3001 3002 3003 3004; do
            for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$port/health" > /dev/null && break; sleep 1; done
          done

      - name: An instance without passwords refuses to start without email, and says why
        run: |
          out=$(timeout 60 docker run --rm -e SIGN_IN_METHOD=passkey -e ORIGIN=https://audit.example.com -e INITIAL_ADMIN_EMAIL=first@example.test --read-only --tmpfs /tmp mcp-audit:ci 2>&1) && { echo "it started"; exit 1; }
          echo "$out" | tee /dev/stderr | grep -q "SIGN_IN_METHOD=passkey needs email"

      - name: The image reports its version
        run: curl -s http://127.0.0.1:3002/health | tee /dev/stderr | grep -q '"version":"${{ steps.version.outputs.value }}"'

      - name: Test-only endpoints are closed without TEST_SEED_ENABLED
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:3002/api/test/seed)
          test "$code" = 401

      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run e2e
        env:
          CI: 'true'
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_FIRST_START_URL: http://127.0.0.1:3001
          E2E_PASSKEY_MODE_URL: http://localhost:3003
          E2E_PROFILE_URL: http://localhost:3004
          E2E_LLM_URL: http://host.docker.internal:4999
          E2E_MAIL_URL: http://127.0.0.1:2526

      - name: Tenant host layout, the proxy and two tenants without Cloudflare (#92)
        run: IMAGE=mcp-audit:ci deploy/host/smoke-test.sh

      - name: Backup and restore on a fresh volume
        run: IMAGE=mcp-audit:ci scripts/backup-restore-check.sh

      - name: Container logs
        if: failure()
        run: docker logs app; docker logs first; docker logs passkey; docker logs profile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    name: Publish image to GHCR
    needs: [checks, e2e]
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
