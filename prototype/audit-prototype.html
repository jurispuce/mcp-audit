<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audit App prototype</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f8;--surface:#fff;--surface-sunken:#eceef1;--border:#d5d9df;--border-strong:#8a929e;--ink:#14181d;--ink-muted:#4f5966;--accent:#1f5fbf;--accent-ink:#fff;--accent-soft:#e6effb;--ok:#17663a;--ok-soft:#e3f4ea;--warn:#8a4b00;--warn-soft:#fdf0dc;--danger:#a3231f;--danger-soft:#fbe6e4;--ai:#6a3fa0;--ai-soft:#f1eafa;--shadow:0 1px 2px rgba(20,24,29,.08),0 6px 16px rgba(20,24,29,.12);
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--r-sm:4px;--r-md:8px;--r-lg:12px;--touch:44px;--rail:240px;--bar:56px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111417;--surface:#1a1e23;--surface-sunken:#0c0e11;--border:#333a43;--border-strong:#6b7684;--ink:#eef1f4;--ink-muted:#a7b0bb;--accent:#7fb0ff;--accent-ink:#0b1626;--accent-soft:#1b2b45;--ok:#6fd39a;--ok-soft:#143424;--warn:#f2b35e;--warn-soft:#3a2a10;--danger:#ff9d96;--danger-soft:#431a18;--ai:#c9a9f5;--ai-soft:#2c2140;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#111417;--surface:#1a1e23;--surface-sunken:#0c0e11;--border:#333a43;--border-strong:#6b7684;--ink:#eef1f4;--ink-muted:#a7b0bb;--accent:#7fb0ff;--accent-ink:#0b1626;--accent-soft:#1b2b45;--ok:#6fd39a;--ok-soft:#143424;--warn:#f2b35e;--warn-soft:#3a2a10;--danger:#ff9d96;--danger-soft:#431a18;--ai:#c9a9f5;--ai-soft:#2c2140;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/22px var(--sans)}
h1{font:600 20px/28px var(--sans);margin:0}
h2{font:600 16px/24px var(--sans);margin:0}
p{margin:0}
.muted{color:var(--ink-muted);font-size:13px;line-height:18px}
.ref{font:400 13px/18px var(--mono);color:var(--ink-muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.grow{flex:1;min-width:0}
/* shell */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);display:flex;flex-direction:column;gap:var(--s1);padding:var(--s4) var(--s3);background:var(--surface);border-right:1px solid var(--border);overflow:auto}
.rail .switch{padding:var(--s3);margin-bottom:var(--s3);border:1px solid var(--border-strong);border-radius:var(--r-md);display:flex;flex-direction:column}
.rail .sep{height:1px;margin:var(--s3) 0;background:var(--border)}
.nav{display:flex;align-items:center;gap:var(--s3);min-height:var(--touch);padding:0 var(--s3);border-radius:var(--r-md);color:var(--ink);text-decoration:none;font-weight:600}
.nav svg,.bottombar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto}
main{margin-left:var(--rail);padding:var(--s6);max-width:calc(960px + var(--rail))}
.topbar,.bottombar{display:none}
.screen{display:flex;flex-direction:column;gap:var(--s4);max-width:960px}
.tabs{display:flex;gap:var(--s4);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{flex:none;padding:var(--s3) 0;min-height:var(--touch);border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-muted);font:600 15px/22px var(--sans);cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:767px){
 .rail{display:none}
 main{margin-left:0;padding:var(--s4);padding-bottom:calc(var(--bar) + var(--s8))}
 .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;align-items:center;justify-content:space-between;gap:var(--s2);min-height:var(--bar);padding:0 var(--s4);margin:calc(-1 * var(--s4)) calc(-1 * var(--s4)) var(--s4);background:var(--surface);border-bottom:1px solid var(--border)}
 .topbar strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;min-height:var(--bar);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--border)}
 .bottombar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--bar);color:var(--ink-muted);text-decoration:none;font:600 11px/14px var(--sans)}
 .bottombar a[aria-current="page"]{color:var(--accent)}
 body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--touch);padding:0 var(--s4);border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font:600 15px/22px var(--sans);cursor:pointer}
.btn:focus-visible,.tab:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.ai{border:1px dashed var(--ai);color:var(--ai);background:var(--ai-soft)}
.btn.small{min-height:36px;padding:0 var(--s3);font-size:13px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
label{display:flex;flex-direction:column;gap:var(--s1);font:600 12px/16px var(--sans);letter-spacing:.04em;color:var(--ink-muted)}
input,select,textarea{min-height:var(--touch);padding:var(--s2) var(--s3);border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:400 15px/22px var(--sans);width:100%}
textarea{min-height:88px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3);align-items:end}
.form .wide{grid-column:1/-1}
/* badge, crit */
.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:2px var(--s2);border-radius:999px;font:600 12px/16px var(--sans);letter-spacing:.04em;background:var(--surface-sunken);color:var(--ink-muted);white-space:nowrap;border:1px solid transparent}
.badge svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.info{background:var(--accent-soft);color:var(--accent)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.danger{background:var(--danger-soft);color:var(--danger)}.badge.ai{background:var(--ai-soft);color:var(--ai);border:1px dashed var(--ai)}
.crit{display:inline-flex;align-items:center;gap:var(--s2);font-size:13px;line-height:18px;color:var(--ink-muted)}
.crit span{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.crit i{width:4px;border-radius:1px;background:var(--border)}
.crit i:nth-child(1){height:6px}.crit i:nth-child(2){height:10px}.crit i:nth-child(3){height:14px}
.crit.low i:nth-child(1),.crit.medium i:nth-child(-n+2),.crit.high i{background:var(--ink)}
/* cards */
.card{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.card.proposed{border:1px dashed var(--ai);background:var(--ai-soft)}
.card.locked{background:var(--surface-sunken)}
.card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3)}
.card .meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center;color:var(--ink-muted);font-size:13px;line-height:18px}
.card .actions{display:flex;flex-wrap:wrap;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--border)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.line{display:flex;align-items:center;gap:var(--s3);min-height:var(--touch);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border)}
.line:last-child{border-bottom:0}
.line.current{background:var(--accent-soft)}
.line.head{background:var(--surface-sunken);font-weight:600}
button.line{width:100%;border-left:0;border-right:0;border-top:0;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
button.line.current{background:var(--accent-soft)}
.dot{flex:none;width:24px;height:24px;border-radius:999px;border:2px solid var(--border-strong);display:grid;place-items:center;font:600 12px/1 var(--sans);color:var(--ink-muted)}
.dot.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dot.cur{border-color:var(--accent);color:var(--accent)}
.dot svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:var(--s6);border:1px dashed var(--border-strong);border-radius:var(--r-lg);color:var(--ink-muted)}
.proposal{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) var(--s4);border:1px dashed var(--ai);border-radius:var(--r-lg);background:var(--ai-soft);color:var(--ai);font-weight:600}
.report{white-space:pre-wrap;font:400 13px/20px var(--mono);background:var(--surface-sunken);padding:var(--s4);border-radius:var(--r-md);overflow-x:auto}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);vertical-align:top}
th{font-weight:600;background:var(--surface-sunken)}
details>summary{cursor:pointer;font-weight:600;min-height:var(--touch);display:flex;align-items:center}
.checks{display:flex;flex-direction:column;gap:var(--s1);max-height:220px;overflow:auto;padding:var(--s2);border:1px solid var(--border);border-radius:var(--r-md)}
.checks label{flex-direction:row;align-items:center;gap:var(--s2);font:400 14px/20px var(--sans);letter-spacing:0;color:var(--ink);min-height:32px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,24,29,.4);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:21;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:calc(var(--s4) + env(safe-area-inset-top,0px)) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom,0px));gap:var(--s3);overflow:auto}
.menu{border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.opt{display:block;width:100%;text-align:left;min-height:var(--touch);padding:var(--s2) var(--s3);border:0;border-bottom:1px solid var(--border);background:none;color:var(--ink);font:inherit;cursor:pointer}
.opt:last-child{border-bottom:0}
.opt.on{background:var(--accent-soft)}
.at{color:var(--accent)}
.chip{min-height:36px;padding:0 var(--s3);border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-muted);font:600 13px/18px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=file]{padding:var(--s2)}
.pill{display:inline-flex;align-items:stretch;border:1px solid var(--accent);border-radius:999px;overflow:hidden;background:var(--accent-soft)}
.pill button{border:0;background:none;color:var(--accent);font:600 13px/18px var(--sans);min-height:36px;padding:0 var(--s3);cursor:pointer;text-align:left}
.pill button+button{border-left:1px solid var(--accent);padding:0 var(--s3);font-size:16px}
.pill .when{font-weight:400;opacity:.85;margin-left:var(--s1)}
.pill button:focus-visible,.chip:focus-visible,.opt:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.meter{height:8px;border-radius:999px;background:var(--danger-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.card.gap{border-color:var(--danger)}
.picker .menu{box-shadow:none;max-height:280px;overflow:auto}
.opt.new{color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;text-align:left;cursor:pointer;text-decoration:underline}
.del{text-decoration:line-through;color:var(--danger)}.ins{color:var(--ok);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + var(--s6) + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:var(--s2) var(--s4);border-radius:var(--r-md);font-weight:600;max-width:90%}
</style>
</head>
<body>
<nav class="rail" id="rail" aria-label="Main"></nav>
<main><div class="topbar" id="topbar"></div><div id="view"></div></main>
<nav class="bottombar" id="bottombar" aria-label="Main"></nav>
<div id="sheetroot"></div>
<div id="toastroot" aria-live="polite"></div>
<script>
'use strict';
const P={check:'M5 12l5 5 9-10',plus:'M12 5v14M5 12h14',note:'M4 5h16v11H9l-5 4z',tri:'M12 4l9 16H3zM12 10v4',octo:'M8 3h8l5 5v8l-5 5H8l-5-5V8zM12 8v5',ring:'M12 4a8 8 0 100 16 8 8 0 000-16z',spark:'M12 3v6M12 15v6M3 12h6M15 12h6',lock:'M7 11V8a5 5 0 0110 0v3M5 11h14v9H5z',clock:'M12 4a8 8 0 100 16 8 8 0 000-16zM12 8v4l3 2',home:'M4 11l8-7 8 7v9H4z',setup:'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',plan:'M5 6h14v14H5zM5 10h14M9 3v4M15 3v4',run:'M7 5l12 7-12 7z',findings:'M6 5h12v15H6zM9 12l2 2 4-4',notes:'M5 4h14v16H5zM9 9h6M9 13h6'};
const ic=n=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+P[n]+'"/></svg>';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge=(tone,icon,text)=>'<span class="badge '+tone+'">'+ic(icon)+esc(text)+'</span>';
const crit=l=>'<span class="crit '+String(l).toLowerCase()+'"><span aria-hidden="true"><i></i><i></i><i></i></span>'+esc(l)+'</span>';
const TOPIC={gov:'Governance and risk',acc:'Access and identity',inc:'Incidents and continuity',sup:'Suppliers and development',ppl:'People and awareness'};
const LIB=[{id:'nis2',title:'NIS 2 Directive, Article 21(2)',reqs:[['n-a','Art. 21(2)(a)','Risk analysis and information system security policies','gov'],['n-b','Art. 21(2)(b)','Incident handling','inc'],['n-c','Art. 21(2)(c)','Business continuity, backup management, disaster recovery and crisis management','inc'],['n-d','Art. 21(2)(d)','Supply chain security','sup'],['n-e','Art. 21(2)(e)','Security in acquisition, development and maintenance, including vulnerability handling','sup'],['n-f','Art. 21(2)(f)','Assessing the effectiveness of risk-management measures','gov'],['n-g','Art. 21(2)(g)','Basic cyber hygiene practices and cybersecurity training','ppl'],['n-h','Art. 21(2)(h)','Use of cryptography and encryption','acc'],['n-i','Art. 21(2)(i)','Human resources security, access control and asset management','acc'],['n-j','Art. 21(2)(j)','Multi-factor authentication and secured communications','acc']]},
{id:'iso',title:'ISO/IEC 27001:2022, Annex A (sample)',reqs:[['i-5.1','A.5.1','Policies for information security','gov'],['i-5.15','A.5.15','Access control','acc'],['i-5.17','A.5.17','Authentication information','acc'],['i-5.18','A.5.18','Access rights','acc'],['i-5.19','A.5.19','Information security in supplier relationships','sup'],['i-5.24','A.5.24','Information security incident management planning and preparation','inc'],['i-5.30','A.5.30','ICT readiness for business continuity','inc'],['i-6.3','A.6.3','Information security awareness, education and training','ppl'],['i-8.8','A.8.8','Management of technical vulnerabilities','sup'],['i-8.13','A.8.13','Information backup','inc'],['i-8.24','A.8.24','Use of cryptography','acc']]}];
const REQ={};LIB.forEach(s=>s.reqs.forEach(r=>REQ[r[0]]={id:r[0],code:r[1],title:r[2],topic:r[3],src:s.id}));
const SCALE=[['na','No reasonable assurance','','ring'],['c','Conformity','ok','check'],['cp','Conformity with positive note','ok','plus'],['cn','Conformity with auditor note','info','note'],['minor','Minor non-conformity','warn','tri'],['major','Major non-conformity','danger','octo']];
const POOL=[['acc','Access rights are granted by the system owner and reviewed every six months.'],['acc','Leaver accounts are disabled on the last working day.'],['inc','Security incidents are reported to the IT manager within one hour of detection.'],['inc','Backups are taken daily and a restore test is run every quarter.'],['gov','The information security policy is reviewed by management once a year.'],['gov','Risks are assessed annually and after any major change.'],['sup','Suppliers with system access sign a security annex before onboarding.'],['ppl','All employees complete security awareness training within 30 days of joining.']];
const PHASES=['Define the engagement','Select requirements','Understand the auditee','Set scope handling','Extract internal requirements','Plan events','Run events','Conclude'];
const KEY='audit-proto-v1';
let S;
function fresh(){return{db:{eng:{},scope:{},person:{},risk:{},doc:{},ireq:{},event:{},evid:{},art:{},link:{},finding:{},note:{}},sel:{},revs:{},comments:{},notes:[],seq:1,user:'You',ui:{setup:'requirements',plan:'events',run:'events',findings:'matrix',eventId:null,sheet:null,sheetTab:'details',gap:false,editEvent:null}};}
function load(){try{const t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);const f=fresh();Object.keys(f.db).forEach(k=>{if(!S.db[k])S.db[k]={};});Object.values(S.db.event).forEach(e=>{if(e.status!=='held')e.status='planned';});return;}}catch(e){}S=fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const clone=o=>JSON.parse(JSON.stringify(o));
function put(type,obj,note,ai){if(!obj.id)obj.id=type+(S.seq++);S.db[type][obj.id]=clone(obj);const k=type+':'+obj.id;const list=S.revs[k]||(S.revs[k]=[]);list.push({v:list.length+1,by:ai?'Claude on behalf of '+S.user:S.user,at:Date.now(),ch:ai?'in-app AI':'UI',note:note||'',snap:clone(obj)});save();return S.db[type][obj.id];}
const all=t=>Object.values(S.db[t]).filter(o=>!o.deleted);
const eng=()=>S.db.eng.main;
const multi=()=>eng()&&eng().scopeMode==='multiple';
const selIds=()=>Object.keys(S.sel).filter(id=>REQ[id]);
const fmt=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const checked=name=>Array.from(document.querySelectorAll('input[data-group="'+name+'"]:checked')).map(e=>e.value);
const code=id=>REQ[id]?REQ[id].code:(S.db.ireq[id]?S.db.ireq[id].code:id);
const pl=p=>p.role+(p.name?' ('+p.name+')':'');
const FORMATS=['Interview','Walkthrough','Document review','Technical test','Site visit'];
const KINDS=[['','Kind not set'],'Policy','Procedure','Instruction','Risk register','Other'];
const scopeName=id=>id==='all'?'All scopes':(S.db.scope[id]?S.db.scope[id].name:id);
const route=()=>{const h=location.hash.replace('#','');return['home','setup','plan','run','findings','notes'].includes(h)?h:'home';};
function toast(t){const r=document.getElementById('toastroot');r.innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2200);}
function units(){const out=[];selIds().forEach(r=>{if(multi()&&S.sel[r].handling==='per'&&all('scope').length){all('scope').forEach(s=>out.push({key:r+'@'+s.id,req:r,scope:s.id}));}else out.push({key:r+'@all',req:r,scope:'all'});});return out;}
function evidFor(u){return all('evid').filter(e=>(e.reqs||[]).includes(u.req)&&(e.scope==='all'||u.scope==='all'||e.scope===u.scope));}
const issuesFor=rid=>all('note').filter(n=>n.type==='issue'&&(n.refs||[]).some(r=>r.id===rid));
const linksOf=evId=>all('link').filter(l=>l.evId===evId);

return[[!!e,e?'Created':'Not started'],[sel>0,sel?sel+' selected':'None selected'],[ppl>0&&rk>0,ppl+' roles, '+rk+' risks, '+dc+' documents'],[!!e&&(!multi()||sc>=2),e?(multi()?sc+' scopes':'Single scope'):'Not started'],[ir>0,ir?ir+' confirmed':'None yet'],[pst==='agreed'&&evd.length>0,'Plan '+(pst==='sent'?'sent':pst)+', '+ev.length+' events, '+evd.length+' evidence planned'],[evd.length>0&&evd.every(x=>x.status!=='planned'),rec+' of '+evd.length+' evidence received'],[us.length>0&&ap===us.length,ap+' of '+us.length+' approved']];}

/* ---------- AI simulations ---------- */
const riskReqs=r=>r.reqs||(r.req?[r.req]:[]);
function topCrit(rid){const lv=all('risk').filter(r=>riskReqs(r).includes(rid)).map(r=>r.level);return lv.includes('High')?'High':lv.includes('Medium')?'Medium':lv.length?'Low':'Medium';}
function aiExtract(){let n=0;all('doc').filter(d=>!d.extracted).forEach((d,di)=>{for(let i=0;i<3;i++){const p=POOL[(di*3+i)%POOL.length];const target=selIds().find(r=>REQ[r].topic===p[0]);put('ireq',{code:'INT-'+(Object.keys(S.db.ireq).length+1),text:p[1],doc:d.id,section:'§'+(i+2)+'.1',implements:target?[target]:[],status:'proposed'},'Extracted from '+d.title,true);n++;}d.extracted=true;put('doc',d,'Marked as analysed',true);});toast(n?n+' internal requirements proposed':'No new documents to analyse');}
function aiPlan(){const by={};selIds().forEach(r=>{(by[REQ[r].topic]=by[REQ[r].topic]||[]).push(r);});const ppl=all('person');let i=0,n=0;const start=eng().start?new Date(eng().start):new Date();Object.keys(by).forEach(t=>{if(all('event').some(e=>e.title===TOPIC[t]+' interview'))return;const d=new Date(start.getTime()+i*864e5);const ev=put('event',{title:TOPIC[t]+' interview',format:'Interview',date:d.toISOString().slice(0,10),time:'10:00',dur:60,people:ppl.length?pl(ppl[i%ppl.length]):'To be agreed',reqs:by[t],status:'planned',proposed:true},'Drafted from selected requirements',true);by[t].forEach(r=>put('evid',{eventId:ev.id,text:'Documented rule and one operating record for '+REQ[r].code+' '+REQ[r].title,crit:topCrit(r),reqs:[r],scope:'all',status:'planned',promBy:'',promDue:''},'Drafted with the plan',true));i++;n++;});toast(n?n+' events drafted':'Plan already covers every topic');}
function aiProcess(evId){const arts=all('art').filter(a=>a.eventId===evId&&!all('link').some(l=>l.artId===a.id));const open=all('evid').filter(e=>e.eventId===evId&&!linksOf(e.id).length);let n=0;arts.forEach((a,i)=>{const e=open[i];if(!e)return;put('link',{artId:a.id,evId:e.id,suff:'supports',status:'proposed'},'Attributed by AI',true);n++;});toast(n?n+' evidence links proposed':'Nothing to attribute');}
function aiFinding(u){const evs=evidFor(u),ls=evs.flatMap(e=>linksOf(e.id).filter(l=>l.status==='confirmed'));let v,why;const miss=evs.filter(e=>e.status!=='received');
if(!evs.length){v='na';why='No evidence was planned for this requirement in this scope.';}
else if(ls.some(l=>l.suff==='contradicts')){v=evs.some(e=>e.crit==='High')?'major':'minor';why='Linked evidence contradicts the requirement: '+ls.filter(l=>l.suff==='contradicts').map(l=>S.db.art[l.artId].title).join('; ')+'.';}
else if(!miss.length&&ls.length){v='c';why='All '+evs.length+' planned evidence items were received and '+ls.length+' linked artifacts support the requirement.';}
else{v='na';why='Evidence is incomplete: '+(miss.length?miss.length+' of '+evs.length+' planned items not received':'no artifacts are linked')+'.';}
const iss=issuesFor(u.req);if(iss.length&&v!=='minor'&&v!=='major'){v='na';why+=' '+iss.length+' suspected issue'+(iss.length>1?'s were':' was')+' noted during events and needs evidence before a finding is set.';}
put('finding',{id:u.key,value:v,rationale:why,status:'proposed'},'Finding proposed',true);}

)+'</select></label>':'')+'</div><div><button class="btn primary" data-act="addEvid" data-id="'+e.id+'">Add evidence</button></div></details>';
if(where==='run'){h+='<h2>Auditor notes</h2><div class="card"><p class="muted">Type / for a command: requirement, document, person, promise, issue. Type @ to quote something that already exists. Enter saves the line.</p><span id="n_type"></span><textarea id="n_input" rows="2" style="min-height:66px" placeholder="Type a note, / for commands, @ to mention" autocomplete="off"></textarea><div id="n_menu" class="menu" hidden></div><div class="row"><button class="btn small" data-act="noteChar" data-c="/">/ command</button><button class="btn small" data-act="noteChar" data-c="@">@ mention</button><button class="btn primary small" data-act="addNote">Save note</button></div></div>'+(notes.length?'<div class="list">'+notes.map(n=>'<div class="line" style="align-items:flex-start"><span class="ref">'+off(n)+'</span><span class="grow">'+(n.type!=='note'?badge(NT[n.type][0],NT[n.type][1],NT[n.type][2])+' ':'')+noteHtml(n)+'</span><button class="btn ghost small" data-act="del" data-t="note" data-id="'+n.id+'">Remove</button></div>').join('')+'</div>':'')+'<h2>Files and transcripts</h2><div class="card"><div class="form"><label>Kind<select id="art_kind">'+opts(['Transcript','Document','Screenshot','Photo'])+'</select></label><label>Title<input id="art_title" placeholder="Access review export, October"></label><label class="wide">Text or description<textarea id="art_text"></textarea></label></div><div class="row"><button class="btn primary" data-act="addArt" data-id="'+e.id+'">Add file</button><button class="btn ai" data-act="aiProcess" data-id="'+e.id+'">'+ic('spark')+'Process event materials</button></div></div>'+arts.map(a=>{const ls=all('link').filter(l=>l.artId===a.id);return'<div class="card"><div class="head"><div><span class="ref">'+esc(a.kind)+'</span><h2>'+esc(a.title)+'</h2></div>'+(ls.length?'':badge('','ring','Not linked'))+'</div>'+(a.text?'<p>'+esc(a.text)+'</p>':'')+ls.map(l=>'<div class="row"><span class="muted">'+esc(l.suff)+': '+esc((S.db.evid[l.evId]||{}).text)+'</span>'+(l.status==='proposed'?badge('ai','spark','Proposed by AI')+'<button class="btn primary small" data-act="accept" data-t="link" data-id="'+l.id+'">Accept</button><button class="btn ghost small" data-act="reject" data-t="link" data-id="'+l.id+'">Reject</button>':'<button class="btn ghost small" data-act="del" data-t="link" data-id="'+l.id+'">Unlink</button>')+'</div>').join('')+'<div class="actions"><select style="width:auto;max-width:100%" id="lk_ev_'+a.id+'" aria-label="Evidence item">'+'<option value="">Link to evidence…</option>'+opts(evd.map(x=>[x.id,x.text.slice(0,60)]))+'</select><select style="width:auto" id="lk_suff_'+a.id+'" aria-label="Sufficiency">'+opts(['supports','partial','contradicts'])+'</select><button class="btn small" data-act="addLink" data-id="'+a.id+'">Link</button></div></div>';}).join('');
 const g=k=>evd.filter(x=>x.status===k).map(x=>'  - '+x.text+(k==='promised'?' ('+(x.promBy||'owner not recorded')+', due '+(x.promDue||'no date')+')':'')).join('\n')||'  - none';
 h+='<h2>Post-event report</h2><div class="report">'+esc('Event: '+e.title+' ('+e.date+')\nParticipants: '+e.people+'\n\nReceived:\n'+g('received')+'\n\nPartly received:\n'+g('partial')+'\n\nPromised for later:\n'+g('promised')+'\n\nStill missing:\n'+(evd.filter(x=>x.status==='missing'||x.status==='planned').map(x=>'  - '+x.text+' ['+x.crit+']').join('\n')||'  - none')+'\n\nPromises made in the event:\n'+(notes.filter(n=>n.type==='promise').map(n=>'  - '+n.text).join('\n')||'  - none')+'\n\nSuspected issues (auditor only, not shared):\n'+(notes.filter(n=>n.type==='issue').map(n=>'  - '+n.text).join('\n')||'  - none'))+'</div>';}
return h;}

function vRun(){if(!eng())return'<h1>Run</h1>'+needEng();if(S.ui.eventId&&S.db.event[S.ui.eventId])return vEvent(S.db.event[S.ui.eventId],'run');
const evs=all('event').filter(e=>!e.proposed).sort((a,b)=>String(a.date).localeCompare(String(b.date)));let h='<h1>Run</h1>'+tabs('run',[['events','Events'],['inbox','Inbox']]);
if(S.ui.run==='events')h+=evs.length?evs.map(e=>eventCard(e,'run')).join(''):'<div class="empty">No events to run. Plan and agree events first.<div class="row" style="margin-top:12px"><button class="btn primary" data-act="go" data-r="plan">Go to Plan</button></div></div>';
else{const un=all('art').filter(a=>!all('link').some(l=>l.artId===a.id&&l.status==='confirmed'));h+='<p class="muted">Notes and files that are not yet linked to planned evidence.</p>'+(un.length?'<div class="list">'+un.map(a=>'<button class="line" data-act="openEvent" data-id="'+a.eventId+'"><span class="grow"><strong>'+esc(a.title)+'</strong><br><span class="muted">'+esc(a.kind)+', '+esc((S.db.event[a.eventId]||{}).title)+'</span></span></button>').join('')+'</div>':'<div class="empty">Nothing waiting. Everything captured is linked to evidence.</div>');}
return h;}

function vFindings(){if(!eng())return'<h1>Findings</h1>'+needEng();const us=units(),t=S.ui.findings;let h='<h1>Findings</h1>'+tabs('findings',[['matrix','All'],['approve','To approve'],['done','Conclusions']]);
if(!us.length)return h+'<div class="empty">No assessment units yet. Select requirements in Set-up.</div>';
const F=u=>{const f=S.db.finding[u.key];return f&&!f.deleted?f:null;};const list=us.filter(u=>{const f=F(u);return t==='matrix'||(t==='approve'&&f&&f.status!=='approved')||(t==='done'&&f&&f.status==='approved');});
const nProp=us.filter(u=>F(u)&&F(u).status==='proposed').length,nDraft=us.filter(u=>F(u)&&F(u).status==='draft').length;
h+='<div class="row"><button class="btn ai" data-act="aiFindingAll">'+ic('spark')+'Propose findings</button>'+(nDraft?'<button class="btn" data-act="approveAll">Approve '+nDraft+' drafts</button>':'')+'</div>'+(nProp?'<div class="proposal"><span>'+nProp+' findings proposed by AI</span><button class="btn small" data-act="acceptAll" data-t="finding">Accept all as drafts</button></div>':'');
if(!list.length)h+='<div class="empty">Nothing in this list yet.</div>';
list.forEach((u,ix)=>{const f=F(u),evs=evidFor(u),rec=evs.filter(e=>e.status==='received').length,nl=evs.reduce((n,e)=>n+linksOf(e.id).filter(l=>l.status==='confirmed').length,0),sc=f?SCALE.find(s=>s[0]===f.value):null,st=f?f.status:'none',irs=all('ireq').filter(i=>i.status==='confirmed'&&(i.implements||[]).includes(u.req)),k='finding:'+u.key;
h+='<div class="card'+(st==='proposed'?' proposed':st==='approved'?' locked':'')+'"><div class="head"><div><span class="ref">'+esc(REQ[u.req].code)+', '+esc(scopeName(u.scope))+'</span><h2>'+esc(REQ[u.req].title)+'</h2></div><span class="row" style="justify-content:flex-end">'+(st==='proposed'?badge('ai','spark','Proposed by AI'):st==='approved'?badge('ok','lock','Approved'):'')+(sc?badge(sc[2],sc[3],sc[1]):badge('','ring','No finding yet'))+'</span></div><p class="muted">'+evs.length+' evidence planned, '+rec+' received, '+nl+' artifacts linked'+(irs.length?'. Internal rules: '+irs.map(i=>i.code).join(', '):'')+'</p>';
if(st==='approved'||st==='proposed')h+='<p>'+esc(f.rationale)+'</p>';else h+='<div class="form"><label>Finding<select id="f_val_'+ix+'"><option value="">Choose…</option>'+opts(SCALE.map(s=>[s[0],s[1]]),f?f.value:'')+'</select></label><label class="wide">Rationale<textarea id="f_why_'+ix+'" placeholder="Why the evidence does or does not give reasonable assurance">'+esc(f?f.rationale:'')+'</textarea></label></div>';
const iss=issuesFor(u.req);if(iss.length)h+='<div class="stack" style="gap:4px">'+iss.map(n=>'<span>'+badge('warn','tri','Suspected issue')+' '+esc(n.text)+' <span class="muted">'+esc((S.db.event[n.eventId]||{}).title)+'</span></span>').join('')+'</div>';
h+='<div class="meta">'+hist(k)+'<span>'+((S.comments[k]||[]).length)+' comments</span></div><div class="actions">'+(st==='proposed'?'<button class="btn primary small" data-act="accept" data-t="finding" data-id="'+esc(u.key)+'">Accept as draft</button><button class="btn ghost small" data-act="reject" data-t="finding" data-id="'+esc(u.key)+'">Reject</button>':st==='approved'?'<button class="btn ghost small" data-act="reopen" data-key="'+esc(u.key)+'">Reopen</button>':'<button class="btn small" data-act="saveFinding" data-key="'+esc(u.key)+'" data-i="'+ix+'">Save draft</button>'+(st==='draft'?'<button class="btn primary small" data-act="approve" data-key="'+esc(u.key)+'">Approve</button>':'')+'<button class="btn ai small" data-act="aiFinding" data-key="'+esc(u.key)+'">'+ic('spark')+'Propose</button>')+(f?'<button class="btn ghost small" data-act="sheet" data-k="'+esc(k)+'" data-tab="comments">Comments</button>'+histBtn(k):'')+'</div></div>';});
return h;}

function vNotes(){const txt=S.notes.map(n=>'['+n.screen+'] '+n.text).join('\n');return'<h1>Test notes</h1><p class="muted">Gaps and wrong assumptions you logged while walking through the process. Copy the text below back into the chat to revise the structure document.</p>'+(S.notes.length?'<div class="list">'+S.notes.map((n,i)=>'<div class="line"><span class="grow">'+esc(n.text)+'<br><span class="muted">'+esc(n.screen)+', '+fmt(n.at)+'</span></span><button class="btn ghost small" data-act="delNote" data-i="'+i+'">Remove</button></div>').join('')+'</div><label>All notes as text<textarea readonly style="min-height:160px">'+esc(txt)+'</textarea></label>':'<div class="empty">No notes yet. Use “Log a gap” on any screen.</div>')+'<div class="card"><strong>Prototype data</strong><span class="muted">Everything is stored only in this browser. AI buttons are simulated and nothing is sent anywhere.</span><div><button class="btn danger" data-act="reset">'+(S.ui.sure?'Tap again to erase everything':'Erase and start over')+'</button></div></div>';}

function vSheet(){const k=S.ui.sheet;if(!k)return'';const i=k.indexOf(':'),type=k.slice(0,i),id=k.slice(i+1),o=S.db[type][id]||{},revs=(S.revs[k]||[]).slice().reverse(),cm=S.comments[k]||[],t=S.ui.sheetTab;
const show=v=>Array.isArray(v)?v.map(code).join(', '):(REQ[v]?REQ[v].code:String(v));
const title=o.title||o.name||o.text||(type==='finding'?REQ[id.split('@')[0]].code+', '+scopeName(id.split('@')[1]):id);
let h='<div class="overlay" data-act="closeSheet"></div><aside class="sheet" role="dialog" aria-label="Item details"><div class="row between"><div><span class="ref">'+esc(type)+'</span><h2>'+esc(String(title).slice(0,80))+'</h2></div><button class="btn small" data-act="closeSheet">Close</button></div><div class="tabs" role="tablist">'+[['details','Details'],['comments','Comments '+cm.length],['history','History '+revs.length]].map(x=>'<button class="tab" role="tab" data-act="sheetTab" data-tab="'+x[0]+'" aria-selected="'+(t===x[0])+'">'+x[1]+'</button>').join('')+'</div>';
if(t==='details')h+='<table>'+Object.keys(o).filter(f=>f!=='id').map(f=>'<tr><th>'+esc(f)+'</th><td>'+esc(show(o[f]))+'</td></tr>').join('')+'</table><p class="muted">Editing happens on the screen the item lives on; every save adds a version here.</p>';
if(t==='comments')h+=(cm.length?cm.map(c=>'<div><p>'+esc(c.text)+'</p><span class="muted">'+esc(c.by)+', '+fmt(c.at)+'</span></div>').join(''):'<p class="muted">No comments yet.</p>')+'<textarea id="c_text" placeholder="Add a comment or log a discussion with the auditee"></textarea><div><button class="btn primary" data-act="comment">Add comment</button></div>';
if(t==='history')h+=revs.map((r,ix)=>{const prev=revs[ix+1],ch=prev?Object.keys(r.snap).filter(f=>JSON.stringify(r.snap[f])!==JSON.stringify(prev.snap[f])).map(f=>esc(f)+': <span class="del">'+esc(show(prev.snap[f]==null?'':prev.snap[f]))+'</span> <span class="ins">'+esc(show(r.snap[f]))+'</span>').join('<br>'):'';return'<div class="row between" style="align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:12px"><div class="grow"><span class="ref">v'+r.v+'</span> '+esc(r.note)+(ch?'<br><span class="muted">'+ch+'</span>':'')+'<br><span class="muted">'+esc(r.by)+', '+fmt(r.at)+', via '+r.ch+(ix===0?', current':'')+'</span></div>'+(ix===0?'':'<button class="btn small" data-act="revert" data-v="'+r.v+'">Revert</button>')+'</div>';}).join('')||'<p class="muted">No versions recorded.</p>';
return h+'</aside>';}

let C={type:'note',refs:[],kind:null},M=[],MI=0;
const NT={note:['','note','Note'],promise:['warn','clock','Promise'],issue:['danger','tri','Suspected issue']};
const CMDS=[['requirement','Quote a requirement'],['document','Quote a document'],['person','Mention a role or person'],['promise','Promise for follow-up'],['issue','Suspected issue']];
function noteHtml(n){let h=esc(n.text);(n.refs||[]).forEach(r=>{h=h.split(esc('@'+r.label)).join('<strong class="at">@'+esc(r.label)+'</strong>');});return h;}
function mentionables(evId,kind,q){const out=[],add=(t,id,label,sub)=>out.push({t:t,id:id,label:label,sub:sub});
if(!kind||kind==='requirement'){selIds().forEach(r=>add('req',r,REQ[r].code,REQ[r].title));all('ireq').filter(i=>i.status==='confirmed').forEach(i=>add('ireq',i.id,i.code,i.text));}
if(!kind||kind==='document')all('doc').forEach(x=>add('doc',x.id,x.title,x.kind||'Document'));
if(!kind||kind==='person')all('person').forEach(p=>add('person',p.id,p.role,p.name||'Role'));
if(!kind)all('evid').filter(e=>e.eventId===evId).forEach(e=>add('evid',e.id,e.text.slice(0,40),'Planned evidence'));
const ql=q.toLowerCase(),res=out.filter(o=>(o.label+' '+o.sub).toLowerCase().includes(ql)).slice(0,8);
if(q&&kind==='document')res.push({t:'newdoc',label:q,sub:'New document mentioned, not received yet'});return res;}
function drawMenu(){const menu=document.getElementById('n_menu');if(!menu)return;menu.hidden=!M.length;menu.innerHTML=M.map((o,i)=>'<button type="button" class="opt'+(i===MI?' on':'')+'" data-pick="'+i+'"><strong>'+esc(o.label)+'</strong> <span class="muted">'+esc(o.sub)+'</span></button>').join('');}
function noteMenu(){const el=document.getElementById('n_input');if(!el)return;const m=el.value.slice(0,el.selectionStart).match(/(^|\s)([\/@])([^\s\/@]*)$/);M=[];MI=0;if(m){if(m[2]==='/')M=CMDS.filter(c=>c[0].startsWith(m[3].toLowerCase())).map(c=>({cmd:c[0],label:'/'+c[0],sub:c[1]}));else M=mentionables(S.ui.eventId,C.kind,m[3]);}else C.kind=null;drawMenu();}
function typeBadge(){const el=document.getElementById('n_type');if(!el)return;el.innerHTML=C.type==='note'?'':'<span class="row">'+badge(NT[C.type][0],NT[C.type][1],'This line is a '+NT[C.type][2].toLowerCase())+'<button class="btn ghost small" data-act="noteType">Make it a plain note</button></span>';}
function pick(i){const el=document.getElementById('n_input'),o=M[i];if(!el||!o)return;const pos=el.selectionStart,upto=el.value.slice(0,pos),rest=el.value.slice(pos),start=upto.search(/[\/@][^\s\/@]*$/);let ins='';
if(o.cmd){if(o.cmd==='promise'||o.cmd==='issue')C.type=o.cmd;else{C.kind=o.cmd;ins='@';}}
else{let ref=o;if(o.t==='newdoc'){const dn=put('doc',{title:o.label,file:'',kind:'',mentioned:true},'Mentioned in an interview');ref={t:'doc',id:dn.id,label:o.label};}C.refs.push({t:ref.t,id:ref.id,label:ref.label});C.kind=null;ins='@'+ref.label+' ';}
el.value=upto.slice(0,start)+ins+rest;const p=start+ins.length;el.focus();el.setSelectionRange(p,p);typeBadge();noteMenu();}
const NAV=[['home','Home'],['setup','Set-up'],['plan','Plan'],['run','Run'],['findings','Findings']];
function render(){const r=route(),name=eng()?eng().name:'No engagement yet',us=units(),toAp=us.filter(u=>{const f=S.db.finding[u.key];return f&&!f.deleted&&f.status!=='approved';}).length;
const cnt={findings:toAp||''};
document.getElementById('rail').innerHTML='<div class="switch"><span class="muted">Engagement</span><strong>'+esc(name)+'</strong></div>'+NAV.map(n=>'<a class="nav" href="#'+n[0]+'"'+(r===n[0]?' aria-current="page"':'')+'>'+ic(n[0])+n[1]+(cnt[n[0]]?'<span class="badge count">'+cnt[n[0]]+'</span>':'')+'</a>').join('')+'<div class="sep"></div><a class="nav" href="#notes"'+(r==='notes'?' aria-current="page"':'')+'>'+ic('notes')+'Test notes'+(S.notes.length?'<span class="badge count">'+S.notes.length+'</span>':'')+'</a><button class="btn small" style="margin-top:8px" data-act="gap">Log a gap</button>';
document.getElementById('topbar').innerHTML='<strong>'+esc(name)+'</strong><span class="row" style="flex-wrap:nowrap"><button class="btn small" data-act="gap">Log a gap</button><a class="btn ghost small" href="#notes">Notes'+(S.notes.length?' '+S.notes.length:'')+'</a></span>';
document.getElementById('bottombar').innerHTML=NAV.map(n=>'<a href="#'+n[0]+'"'+(r===n[0]?' aria-current="page"':'')+'>'+ic(n[0])+n[1]+'</a>').join('');
const V={home:vHome,setup:vSetup,plan:vPlan,run:vRun,findings:vFindings,notes:vNotes};
document.getElementById('view').innerHTML='<div class="screen">'+gapBox()+V[r]()+'</div>';
document.getElementById('sheetroot').innerHTML=vSheet();M=[];typeBadge();}
document.addEventListener('click',ev=>{const pk=ev.target.closest('[data-pick]');if(pk){pick(+pk.dataset.pick);return;}const el=ev.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')return;const f=A[el.dataset.act];if(f)f(el.dataset,el);});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-chg]');if(!el)return;const f=A[el.dataset.chg];if(f)f(el.dataset,el);});
document.addEventListener('input',ev=>{if(ev.target.id==='n_input')noteMenu();if(ev.target.dataset&&ev.target.dataset.filter){const q=ev.target.value.trim().toLowerCase(),box=ev.target.closest('[data-filterbox]');box.querySelectorAll('[data-k="'+ev.target.dataset.filter+'"]').forEach(l=>{const c=l.querySelector('input[type=checkbox]');l.style.display=(!q||l.dataset.text.includes(q)||(c&&c.checked))?'':'none';});}});
document.addEventListener('keydown',ev=>{if(ev.target.id!=='n_input')return;if(M.length){if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();MI=(MI+(ev.key==='ArrowDown'?1:M.length-1))%M.length;drawMenu();}else if(ev.key==='Enter'||ev.key==='Tab'){ev.preventDefault();pick(MI);}else if(ev.key==='Escape'){M=[];drawMenu();}}else if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();A.addNote();}});
window.addEventListener('hashchange',()=>{S.ui.pick=null;S.ui.eventId=null;S.ui.gap=false;S.ui.editEvent=null;C={type:'note',refs:[],kind:null};render();window.scrollTo(0,0);});
load();render();

</script>
